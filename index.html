<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LinuxX Bot</title>
<style>
:root{--bg:#050607;--panel:#0b0f10;--panel2:#101617;--line:#1b2828;--green:#00ff9a;--text:#eafff6;--muted:#7f9690;--red:#ff5570}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12382c 0,#07100e 35%,#050607 70%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.splash{position:fixed;inset:0;background:#030504;display:flex;align-items:center;justify-content:center;z-index:10;transition:.7s}.splash.hide{opacity:0;pointer-events:none}
.logo{text-align:center}.mark{width:92px;height:92px;border:2px solid var(--green);border-radius:28px;margin:auto;display:grid;place-items:center;box-shadow:0 0 45px #00ff9a35, inset 0 0 25px #00ff9a12;font-size:30px;font-weight:900;color:var(--green)}
.logo h1{margin:22px 0 5px;font-size:34px;letter-spacing:2px}.logo p{margin:0;color:#6e847e;font-size:11px;letter-spacing:3px}.loader{height:3px;width:180px;background:#16211f;border-radius:9px;margin:28px auto 0;overflow:hidden}.loader i{display:block;height:100%;width:0;background:var(--green);animation:load 3s linear forwards}@keyframes load{to{width:100%}}
.app{max-width:520px;margin:auto;padding:18px 16px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 0 20px}.brand{display:flex;align-items:center;gap:11px}.mini{width:43px;height:43px;border:1px solid #21463a;border-radius:14px;display:grid;place-items:center;color:var(--green);font-weight:900;background:#0a1210}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px;margin-top:3px}.gear{width:43px;height:43px;border:1px solid var(--line);border-radius:14px;background:#0b1011;color:#9eb1ac;font-size:20px}
.card{background:linear-gradient(145deg,#0c1213,#080b0c);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 18px 50px #0008}.section{font-size:11px;color:var(--green);letter-spacing:2px;margin-bottom:14px}
.field{margin:10px 0}.field label{display:block;color:#7f9690;font-size:11px;margin:0 0 7px 4px}.input{width:100%;background:#070a0b;border:1px solid #1a2827;border-radius:15px;padding:14px;color:#ecfff8;outline:none;font-size:14px;transition:.2s}.input:focus{border-color:#00ff9a66;box-shadow:0 0 0 3px #00ff9a0d}
.status{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#080d0d;border:1px solid var(--line);border-radius:17px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--red);box-shadow:0 0 12px #ff5570}.online .dot{background:var(--green);box-shadow:0 0 12px #00ff9a}.state{display:flex;align-items:center;gap:9px;font-size:13px}.stateText{font-weight:700}.switch{width:58px;height:32px;background:#18201f;border-radius:30px;padding:4px;border:1px solid #273331;cursor:pointer}.knob{width:22px;height:22px;border-radius:50%;background:#788681;transition:.25s}.switch.on{background:#004d35;border-color:#00ff9a66}.switch.on .knob{transform:translateX(-26px);background:var(--green);box-shadow:0 0 13px #00ff9a88}
.terminal{font-family:ui-monospace,SFMono-Regular,monospace;background:#030505;border-radius:18px;border:1px solid #15211f;padding:14px;min-height:145px;color:#91b3a8;font-size:11px;line-height:1.8;direction:ltr;text-align:left;overflow:hidden}.terminal .ok{color:var(--green)}.terminal .warn{color:#f4c95d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #21302e;background:#101717;color:#dffaf1;padding:14px;border-radius:15px;font-weight:700}.btn.primary{background:var(--green);color:#03100a;border-color:var(--green)}.hint{text-align:center;color:#52645f;font-size:10px;margin-top:15px}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="logo"><div class="mark">LX</div><h1>LinuxX Bot</h1><p>HIGHRISE CONTROL</p><div class="loader"><i></i></div></div></div>
<main class="app">
<header class="top"><div class="brand"><div class="mini">LX</div><div><b>LinuxX Bot</b><small>HIGHRISE ENGINE</small></div></div><button class="gear">⚙</button></header>
<section class="card"><div class="section">BOT CONFIGURATION</div>
<div class="field"><label>روبیکا توکن</label><input id="token" class="input" type="password" placeholder="توکن بات را وارد کنید"></div>
<div class="field"><label>لینک / کد روم</label><input id="room" class="input" placeholder="لینک یا کد روم"></div>
<div class="field"><label>نام کاربری مدیر</label><input id="user" class="input" placeholder="@username"></div>
</section>
<section class="card"><div class="section">BOT STATUS</div>
<div class="status" id="status"><div class="state"><span class="dot"></span><span class="stateText">BOT OFFLINE</span></div><div class="switch" id="sw"><div class="knob"></div></div></div>
</section>
<section class="card"><div class="section">TERMINAL</div><div class="terminal" id="term"><div class="ok">> LinuxX initialized</div><div>> Waiting for configuration...</div><div>> Engine: HIGHRISE</div></div></section>
<section class="card"><div class="actions"><button class="btn" id="save">ذخیره تنظیمات</button><button class="btn primary" id="clear">پاک کردن</button></div><div class="hint">LinuxX Bot • Local configuration</div></section>
</main>
<script>
const $=id=>document.getElementById(id),term=$('term'),sw=$('sw'),status=$('status');
function log(t,c=''){let d=document.createElement('div');d.className=c;d.textContent='> '+t;term.appendChild(d);term.scrollTop=term.scrollHeight}
['token','room','user'].forEach(id=>$(id).value=localStorage.getItem('lx_'+id)||'');
$('save').onclick=()=>{['token','room','user'].forEach(id=>localStorage.setItem('lx_'+id,$(id).value));log('Configuration saved','ok')};
$('clear').onclick=()=>{['token','room','user'].forEach(id=>{localStorage.removeItem('lx_'+id);$(id).value=''});log('Configuration cleared','warn')};
sw.onclick=()=>{let on=!sw.classList.contains('on');sw.classList.toggle('on',on);status.classList.toggle('online',on);status.querySelector('.stateText').textContent=on?'BOT ONLINE':'BOT OFFLINE';if(on){log('Starting engine...','ok');setTimeout(()=>log('Waiting for Highrise connection...','ok'),500)}else log('Engine stopped','warn')};
setTimeout(()=>$('splash').classList.add('hide'),3000);
</script>
</body></html>
